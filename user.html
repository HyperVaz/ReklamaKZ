<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Авторизация</title>
    <meta name="description" content="Авторизация">
    
    <!-- Подключение шрифта Museo -->
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@500&display=swap" rel="stylesheet">
    

</head>
<body>
    <!-- Фон с анимацией -->
    <div class='ripple-bg' data-colors='["#ffea1d", "#ffd909", "#ffc800", "#ffe538", "#ffb81b"]'></div>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="container">
            <!-- Хлебные крошки -->
            <div class="breadcrumbs">
                <a href="index.html">Главная</a>
                <span class="breadcrumbs-separator">/</span>
                <a href="user.html">Регистрация</a>
                <span class="breadcrumbs-separator">/</span>
                <span class="breadcrumbs-current">Авторизация</span>
            </div>

            <h1>Авторизация</h1>

            <!-- Форма авторизации -->
            <div class="g-auth-page-block-wr">
                <div class="g-auth-page-block">
                    <div class="g-auth-page-block__sideleft">
                        <form action="https://mos-advertising-company.oml.ru/user/login" method="post">
                            <div class="g-form-field g-auth__row">
                                <div class="g-form-field__title">
                                    <label for="login">E-mail:</label>
                                </div>
                                <input required class="g-form-control-text" name="login" id="login" placeholder="sample@domain.ru" type="text" value="">
                            </div>
                            <div class="g-form-field g-auth__row">
                                <div class="g-form-field__title">
                                    <label for="password">Пароль:</label>
                                    <div class="g-auth__fogot-password-w">
                                        <a href="user/forgot_password.html" class="g-auth__fogot-password">Забыли пароль?</a>
                                    </div>
                                </div>
                                <input required class="g-form-control-text" type="password" name="password" id="password" placeholder="**********">
                            </div>
                            <div class="g-auth__right-container">
                                <a href="user/register.html" class="g-button g-button--invert">Регистрация</a>
                            </div>
                            <div class="g-auth__left-container">
                                <button type="submit" class="g-button">Вход</button>
                            </div>
                        </form>
                    </div>
                    <div class="g-auth-page-block__sideright">
                        <div class="g-auth__row">
                            <div class="g-auth__personal-note">
                                Я выражаю <a href="user/agreement.html?mode=agreement" target="_blank">согласие на передачу и обработку персональных данных</a> в соответствии с <a href="user/policy.html?mode=policy" target="_blank">политикой конфиденциальности</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Подвал -->
    <footer>
        <div class="container">
            <p>Copyright &copy; 2024 - 2025 Название компании</p>
        </div>
    </footer>

    <script>
        // Инициализация риппл-эффекта фона
        document.addEventListener('DOMContentLoaded', function() {
            initRippleEffect();
        });

        function initRippleEffect() {
            const rippleBg = document.querySelector('.ripple-bg');
            if (!rippleBg) return;

            const colors = JSON.parse(rippleBg.getAttribute('data-colors') || '["#ffea1d", "#ffd909", "#ffc800", "#ffe538", "#ffb81b"]');
            
            function createRipple() {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                
                const size = Math.random() * 100 + 50;
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.left = `${x}%`;
                ripple.style.top = `${y}%`;
                ripple.style.backgroundColor = color;
                
                rippleBg.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 1000);
            }
            
            // Создаем несколько рипплов при загрузке
            for (let i = 0; i < 5; i++) {
                setTimeout(createRipple, i * 200);
            }
            
            // Периодическое создание новых рипплов
            setInterval(createRipple, 1000);
        }
    </script>
</body>
</html>
